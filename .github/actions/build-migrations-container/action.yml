name: Build migrations container
description: Build and publish ef migrations Container

inputs:  
  solution_path:
    description: 'Path to the .sln file (kept for compatibility; ef_startup_project is what gets restored and built)'
    required: true
  project_path:
    description: 'Path to the .csproj file (kept for compatibility; ef_startup_project is what gets restored and built)'
    required: true
  token:
    description: "GitHub token"
    required: true  
  package_user:
    description: "Package User"
    required: true
  package_password:
    description: "Package Password"
    required: true
  github_actor:
    description: "GitHub Actor"
    required: true
  container_name:
    description: "Docker container name"
    required: true
  ef_project:
    description: "EF Project"
    required: true
  ef_startup_project:
    description: "EF Startup Project"
    required: true
  ef_context:
    description: "Optional EF DbContext name"
    required: false
  self_contained:
    description: "'true' bundles the .NET runtime into efbundle; 'false' builds a framework-dependent bundle, which needs an ASP.NET Core base image (mcr.microsoft.com/dotnet/aspnet)"
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4
      with:
        versionSpec: '6.x'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4

    - name: Set VERSION based on branch
      shell: bash
      run: |
          if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "VERSION=${{ steps.gitversion.outputs.assemblySemFileVer }}" >> $GITHUB_ENV
          else
            echo "VERSION=${{ steps.gitversion.outputs.FullSemVer }}" | tr '+' '-' >> $GITHUB_ENV
          fi

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.x'

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Setup Ef Core Tools
      shell: bash
      run: dotnet tool install dotnet-ef --version 10.0.8 --global

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
          registry: ghcr.io
          username: ${{ inputs.github_actor }}
          password: ${{ inputs.token }}

    - name: Configure NuGet Authentication
      shell: bash
      run: |
        dotnet nuget remove source CMZ-MTM || true
        dotnet nuget add source "https://nuget.pkg.github.com/cmz-mtm/index.json" \
          --name CMZ-MTM \
          --username ${{ inputs.package_user }} \
          --password ${{ inputs.package_password }} \
          --store-password-in-clear-text \
          --configfile NuGet.Config

    - name: Build EF startup project
      shell: bash
      run: |
        set -euo pipefail
        SELF_CONTAINED="${{ inputs.self_contained }}"
        STARTUP_PROJECT="${{ github.workspace }}/${{ inputs.ef_startup_project }}"

        if [[ "$SELF_CONTAINED" != "true" && "$SELF_CONTAINED" != "false" ]]; then
          echo "::error::Invalid self_contained value '$SELF_CONTAINED'. Use 'true' or 'false'."
          exit 1
        fi

        if [[ "$SELF_CONTAINED" == "false" ]]; then
          # Same flags as the publish that "migrations bundle" runs internally, so the bundle
          # reuses this restore and build instead of compiling the application again.
          dotnet publish "$STARTUP_PROJECT" \
            --configuration Release \
            --runtime linux-x64 \
            --no-self-contained \
            --disable-build-servers \
            --output "${{ runner.temp }}/ef-startup-publish"
        else
          dotnet build "$STARTUP_PROJECT" --configuration Release
        fi

    - name: Build EF migration bundle
      shell: bash
      working-directory: migrations
      run: |
        set -euo pipefail
        export PATH="$PATH:/home/runner/.dotnet/tools"
        EF_CONTEXT="${{ inputs.ef_context }}"
        SELF_CONTAINED="${{ inputs.self_contained }}"

        # The startup project was already built in Release by the previous step.
        dotnet_ef_args=(
          migrations bundle
          --verbose
          --project "${{ github.workspace }}/${{ inputs.ef_project }}"
          --startup-project "${{github.workspace}}/${{ inputs.ef_startup_project }}"
          --configuration Release
          --no-build
          --output efbundle
          --target-runtime linux-x64
        )

        if [[ "$SELF_CONTAINED" == "true" ]]; then
          dotnet_ef_args+=(--self-contained)
        else
          # Load the startup assembly from the linux-x64 build of the previous step.
          dotnet_ef_args+=(--runtime linux-x64)
        fi

        if [[ -n "$EF_CONTEXT" ]]; then
          dotnet_ef_args+=(--context "$EF_CONTEXT")
        fi

        dotnet ef "${dotnet_ef_args[@]}"

    - name: Build and Push Migration Image (Test)
      if: github.ref == 'refs/heads/test'
      uses: docker/build-push-action@v7
      with:
        context: ./migrations
        file: ${{github.workspace}}/migrations/Dockerfile
        tags: |
            ghcr.io/cmz-mtm/${{ inputs.container_name }}:${{ env.VERSION }}
            ghcr.io/cmz-mtm/${{ inputs.container_name }}:test-latest
        push: true

    - name: Build and Push Migration Image (Master)
      if: github.ref == 'refs/heads/master'
      uses: docker/build-push-action@v7
      with:
        context: ./migrations
        file: ${{github.workspace}}/migrations/Dockerfile
        tags: |
            ghcr.io/cmz-mtm/${{ inputs.container_name }}:${{ env.VERSION }}
            ghcr.io/cmz-mtm/${{ inputs.container_name }}:latest
        push: true
          
    - name: Build and Push Migration Image (Dev)
      if: github.ref == 'refs/heads/dev'
      uses: docker/build-push-action@v7
      with:
        context: ./migrations
        file: ${{github.workspace}}/migrations/Dockerfile
        tags: ghcr.io/cmz-mtm/${{ inputs.container_name }}:dev-latest
        push: true 
