name: Deploy (Tailscale + Docker Compose)

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment label (test/prod)"
        required: true
        type: string

      app_name:
        description: "Directory name on the server (defaults to repo name)"
        required: false
        type: string

      migrations_needed:
        description: "Override migrations (yes/no)"
        required: false
        type: string

      migrations_timeout_seconds:
        description: "Max seconds to wait for the migrations container to finish"
        required: false
        type: number
        default: 900

    secrets:
      TAILSCALE_AUTHKEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1) Resolve config from repo/org variables (simple) + validate
      - name: Resolve and validate deployment config
        env:
          ENVIRONMENT: ${{ inputs.environment }}

          SERVER_TEST: ${{ vars.DEPLOY_SERVER_TEST }}
          SERVER_PROD: ${{ vars.DEPLOY_SERVER_PROD }}

          DEPLOY_USER_VAR: ${{ vars.DEPLOY_USER }}
          APPS_ROOT_VAR: ${{ vars.DEPLOY_APPS_ROOT }}

          # PRIORIDAD: input > var
          MIGRATIONS_NEEDED_VAR: ${{ inputs.migrations_needed || vars.DEPLOY_MIGRATIONS_NEEDED }}
          MIGRATIONS_NAME_VAR: ${{ vars.DEPLOY_MIGRATIONS_CONTAINER_NAME }}

        run: |
          set -e

          # Pick server based on environment
          if [ "$ENVIRONMENT" = "prod" ]; then
            SERVER="$SERVER_PROD"
            if [ -z "$SERVER" ]; then
              echo "::error::DEPLOY_SERVER_PROD is not set. Please set it in repo variables."
              exit 1
            fi
          else
            SERVER="$SERVER_TEST"
            if [ -z "$SERVER" ]; then
              echo "::error::DEPLOY_SERVER_TEST is not set. Please set it in repo variables."
              exit 1
            fi
          fi

          DEPLOY_USER="${DEPLOY_USER_VAR:-deploy}"
          APPS_ROOT="${APPS_ROOT_VAR:-/srv/apps}"

          # Migrations config
          NEED="$(echo "${MIGRATIONS_NEEDED_VAR:-no}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          MIG_NAME="$(echo "${MIGRATIONS_NAME_VAR:-}" | tr -d '[:space:]')"

          if [[ "$NEED" == "yes" || "$NEED" == "true" || "$NEED" == "1" ]]; then
            if [ -z "$MIG_NAME" ]; then
              echo "::error::DEPLOY_MIGRATIONS_NEEDED is enabled but DEPLOY_MIGRATIONS_CONTAINER_NAME is empty. Please set it in repo variables."
              exit 1
            fi
          fi

          # Export for later steps
          echo "DEPLOY_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "DEPLOY_USER=$DEPLOY_USER" >> "$GITHUB_ENV"
          echo "DEPLOY_APPS_ROOT=$APPS_ROOT" >> "$GITHUB_ENV"
          echo "DEPLOY_MIGRATIONS_NEEDED=$NEED" >> "$GITHUB_ENV"
          echo "DEPLOY_MIGRATIONS_CONTAINER_NAME=$MIG_NAME" >> "$GITHUB_ENV"

          echo "✅ Resolved config:"
          echo "  - env: $ENVIRONMENT"
          echo "  - server: $SERVER"
          echo "  - user: $DEPLOY_USER"
          echo "  - apps_root: $APPS_ROOT"
          echo "  - migrations_needed: $NEED"
          echo "  - migrations_name: ${MIG_NAME:-<none>}"

      # 2) Authorize prod deployments (only prod)
      - name: Authorize production deployment
        if: inputs.environment == 'prod'
        env:
          ALLOWED_ACTORS: ${{ vars.DEPLOY_PROD_ALLOWED_ACTORS }}
        run: |
          allowed="${ALLOWED_ACTORS//[[:space:]]/}"

          if [ -z "$allowed" ]; then
            echo "::error::DEPLOY_PROD_ALLOWED_ACTORS is empty/unset. Denying prod deployment."
            exit 1
          fi

          case ",$allowed," in
            *,"$GITHUB_ACTOR",*)
              echo "✅ Authorized: $GITHUB_ACTOR"
              ;;
            *)
              echo "::error::Unauthorized actor '$GITHUB_ACTOR'. Allowed: $allowed"
              exit 1
              ;;
          esac

      # 3) Tailscale connect
      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailnet
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-deploy-${{ github.event.repository.name }}-${{ inputs.environment }}-${{ github.run_id }}" \
            --accept-dns=true

      # 4) Migrations first (if enabled).
      #    The migrations container is one-shot: it applies the EF bundle and exits. We wait
      #    for it and propagate its exit code, so a failed migration fails the deployment
      #    instead of letting step 5 publish an application against a stale schema.
      - name: Deploy migrations (optional)
        env:
          MIGRATIONS_TIMEOUT_SECONDS: ${{ inputs.migrations_timeout_seconds }}
        run: |
          set -euo pipefail

          if [[ "$DEPLOY_MIGRATIONS_NEEDED" != "yes" && "$DEPLOY_MIGRATIONS_NEEDED" != "true" && "$DEPLOY_MIGRATIONS_NEEDED" != "1" ]]; then
            echo "ℹ️ Migrations not enabled. Skipping."
            exit 0
          fi

          MIG_DIR="${DEPLOY_APPS_ROOT}/infra-${DEPLOY_SERVER}/${DEPLOY_MIGRATIONS_CONTAINER_NAME}"
          MIG_CONTAINER="${DEPLOY_MIGRATIONS_CONTAINER_NAME}"
          SSH_TARGET="${DEPLOY_USER}@${DEPLOY_SERVER}"

          echo "📦 Deploying migrations from: ${MIG_DIR}"

          tailscale ssh "$SSH_TARGET" "
            set -e
            cd ${MIG_DIR}
            docker compose pull
            docker compose up -d --force-recreate
          "

          # 'docker wait' blocks until the one-shot container exits and prints its exit code.
          # It is its own ssh call so the command substitution is evaluated on the runner and
          # not inside the quoted remote script.
          echo "⏳ Waiting for ${MIG_CONTAINER} to finish (timeout: ${MIGRATIONS_TIMEOUT_SECONDS}s)..."
          MIG_EXIT_CODE="$(tailscale ssh "$SSH_TARGET" \
            "timeout ${MIGRATIONS_TIMEOUT_SECONDS} docker wait ${MIG_CONTAINER}" \
            | tr -d '[:space:]' || true)"

          echo "::group::Migration logs (${MIG_CONTAINER})"
          tailscale ssh "$SSH_TARGET" "cd ${MIG_DIR} && docker compose logs --no-color --tail 500" || true
          echo "::endgroup::"

          # One-shot container: never leave it running. This also stops the restart loop on
          # any server whose compose file still carries the old 'restart' policy.
          tailscale ssh "$SSH_TARGET" "cd ${MIG_DIR} && docker compose stop" >/dev/null 2>&1 || true

          if [ "$MIG_EXIT_CODE" != "0" ]; then
            echo "::error::Migrations failed (exit code: ${MIG_EXIT_CODE:-timeout}). Aborting before the application is deployed."
            exit 1
          fi

          echo "✅ Migrations applied successfully."

      # 5) Deploy application
      - name: Deploy application
        run: |
          set -euo pipefail

          APP_NAME="${{ inputs.app_name || github.event.repository.name }}"

          DEPLOY_DIR="${DEPLOY_APPS_ROOT}/infra-${DEPLOY_SERVER}/${APP_NAME}"

          echo "📦 Deploying application from: ${DEPLOY_DIR}"

          tailscale ssh "${DEPLOY_USER}@${DEPLOY_SERVER}" "
            set -e
            cd ${DEPLOY_DIR}
            docker compose pull
            docker compose up -d
          "
