name: Deploy (Tailscale + Docker Compose)

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment label (test/prod)"
        required: true
        type: string
      server:
        description: "Tailscale MagicDNS name of the target server (e.g. testsrv01)"
        required: true
        type: string
      deploy_user:
        description: "SSH user on the target server"
        required: false
        type: string
        default: "deploy"
      apps_root:
        description: "Base path where the infra repos are stored"
        required: false
        type: string
        default: "/srv/apps"
    secrets:
      TAILSCALE_AUTHKEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Authorize production deployment
        if: inputs.environment == 'prod'
        env:
          ALLOWED_ACTORS: ${{ vars.DEPLOY_PROD_ALLOWED_ACTORS }}
        run: |
          allowed="${ALLOWED_ACTORS//[[:space:]]/}"

          if [ -z "$allowed" ]; then
            echo "::error::DEPLOY_PROD_ALLOWED_ACTORS is empty/unset. Denying prod deployment."
            exit 1
          fi

          case ",$allowed," in
            *,"$GITHUB_ACTOR",*)
              echo "✅ Authorized: $GITHUB_ACTOR"
              ;;
            *)
              echo "::error::Unauthorized actor '$GITHUB_ACTOR'. Allowed: $allowed"
              exit 1
              ;;
          esac

      - name: Install Tailscale
        run: curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailnet
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscale up \
            --authkey="$TS_AUTHKEY" \
            --hostname="github-deploy-${{ github.event.repository.name }}-${{ inputs.environment }}-${{ github.run_id }}" \
            --accept-dns=true

      - name: Deploy migrations (optional)
        env:
          MIGRATIONS_NEEDED: ${{ vars.DEPLOY_MIGRATIONS_NEEDED }}
          MIGRATIONS_NAME: ${{ vars.DEPLOY_MIGRATIONS_CONTAINER_NAME }}
        run: |
          BASE_DIR="${{ inputs.apps_root }}/infra-${{ inputs.server }}"
          need="$(echo "${MIGRATIONS_NEEDED:-no}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
          mig_name="$(echo "${MIGRATIONS_NAME:-}" | tr -d '[:space:]')"

          if [[ "$need" == "yes" || "$need" == "true" || "$need" == "1" ]]; then
            if [ -z "$mig_name" ]; then
              echo "::error::DEPLOY_MIGRATIONS_NEEDED is enabled but DEPLOY_MIGRATIONS_CONTAINER_NAME is empty."
              exit 1
            fi

            MIG_DIR="${BASE_DIR}/${mig_name}"
            echo "📦 Migrations enabled. Deploying from: ${MIG_DIR}"

            tailscale ssh "${{ inputs.deploy_user }}@${{ inputs.server }}" "
              set -e
              cd ${MIG_DIR}
              docker compose pull
              docker compose up -d
            "
          else
            echo "ℹ Migrations not enabled (DEPLOY_MIGRATIONS_NEEDED=${MIGRATIONS_NEEDED:-unset}). Skipping."
          fi

      - name: Deploy application
        run: |
          REPO="${{ github.event.repository.name }}"
          DEPLOY_DIR="${{ inputs.apps_root }}/infra-${{ inputs.server }}/${REPO}"

          tailscale ssh "${{ inputs.deploy_user }}@${{ inputs.server }}" "
            set -e
            cd ${DEPLOY_DIR}
            docker compose pull
            docker compose up -d
          "
