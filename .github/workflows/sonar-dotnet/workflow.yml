name: SonarQube analysis

# --------------------------------------------------
# Triggers
# - Manual execution (workflow_dispatch)
# - Scheduled execution (weekly)
# --------------------------------------------------
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # Every Monday at 07:00 UTC

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout source code
      # - fetch-depth: 0 is required by SonarQube
      #   to compute blame, history, and metrics correctly
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Private network access (Tailscale)
      # - Required to reach the self-hosted SonarQube server
      # - The auth key is tagged as `tag:ci`
      # - ACLs restrict access only to SonarQube
      # --------------------------------------------------
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # --------------------------------------------------
      # .NET SDK installation
      # - Version aligned with the project and test workflows
      # - GitHub-hosted runners already include runtimes,
      #   but we explicitly set the SDK version for consistency
      # --------------------------------------------------
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # --------------------------------------------------
      # Install SonarScanner for .NET
      # - Required to run `dotnet sonarscanner begin/end`
      # - Installed as a global .NET tool
      # - PATH is updated so the command is available
      # --------------------------------------------------
      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # --------------------------------------------------
      # SonarQube: begin analysis
      # - Must run BEFORE restore/build/test
      # - Secrets are passed via environment variables
      #   (recommended secure practice)
      # - Project key is the technical identifier
      # - Project name is cosmetic (UI only)
      # --------------------------------------------------
      - name: Sonar Begin
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"translations-backend" \
            /n:"Translations Backend" \
            /d:sonar.host.url="$SONAR_HOST_URL" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"

      # --------------------------------------------------
      # NuGet authentication (GitHub Packages)
      # - Reuses the NuGet.Config committed in the repository
      # - Credentials are injected at runtime
      # - Required to restore internal/private packages
      # --------------------------------------------------
      - name: Configure NuGet Authentication
        env:
          NUGET_USER: ${{ secrets.PACKAGE_USER }}
          NUGET_TOKEN: ${{ secrets.PACKAGE_READ }}
        run: |
          dotnet nuget remove source CMZ-MTM || true
          dotnet nuget add source \
            "https://nuget.pkg.github.com/cmz-mtm/index.json" \
            --name CMZ-MTM \
            --username "$NUGET_USER" \
            --password "$NUGET_TOKEN" \
            --store-password-in-clear-text \
            --configfile NuGet.Config

      # --------------------------------------------------
      # Build
      # - Performs restore implicitly
      # - Compilation happens inside the Sonar analysis scope
      # --------------------------------------------------
      - name: Build
        run: dotnet build src/TranslationsBackend.API.sln --configuration Release

      # --------------------------------------------------
      # Tests + coverage
      # - Runs unit tests
      # - Generates OpenCover coverage reports
      # - Coverage will be imported by SonarQube if detected
      # --------------------------------------------------
      - name: Run Unit Tests
        run: |
          dotnet test src/TranslationsBackend.API.sln \
            --no-build \
            --configuration Release \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=./TestResults/coverage.opencover.xml

      # --------------------------------------------------
      # SonarQube: end analysis
      # - Must be the LAST Sonar-related step
      # - Uploads analysis results to the SonarQube server
      # --------------------------------------------------
      - name: Sonar End
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
